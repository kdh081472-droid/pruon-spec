.rc-card.flip{border-color:var(--amber-soft);box-shadow:0 18px 40px -28px rgba(227,154,22,.45)}
.rc-card-label{font-size:12px;color:var(--mut);letter-spacing:.02em;margin-bottom:16px}
.rc-ko{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:700;font-size:28px;line-height:1.35;letter-spacing:-.01em}
.rc-answer{margin-top:22px;padding-top:20px;border-top:1px dashed var(--line);animation:rise .25s ease}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rc-es-row{display:flex;align-items:flex-start;gap:12px}
.rc-speak-wrap{display:flex;flex-direction:column;align-items:flex-start;flex:none}
.rc-speak-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  color:var(--pine);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  flex:none;transition:.15s}
.rc-speak-btn:hover:not(:disabled){background:var(--pine);color:#fff;border-color:var(--pine)}
.rc-speak-btn:disabled{opacity:.6;cursor:default}
.rc-speak-btn.err{border-color:var(--clay);color:var(--clay)}
.rc-speak-btn.on{background:var(--pine);color:#fff;border-color:var(--pine);font-size:12px}
.rc-speak-err{margin-top:4px;font-size:11px;color:var(--clay);max-width:160px;line-height:1.4}
.rc-es{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:27px;line-height:1.3;color:var(--pine);flex:1}
.rc-pron{margin-top:8px;font-size:15px;color:var(--marigold);font-weight:500;letter-spacing:.01em}
.rc-note{margin-top:10px;font-size:14px;color:var(--mut);display:flex;gap:7px;align-items:flex-start;white-space:pre-line}
.rc-note-tag{flex:none;font-size:10px;font-weight:700;color:var(--pine);background:#eef6f4;
  border-radius:5px;padding:2px 6px;letter-spacing:.03em}
.rc-reveal{margin-top:20px;width:100%;padding:16px;border:none;border-radius:14px;background:var(--ink);color:#fff;
  font:inherit;font-size:16px;font-weight:600;cursor:pointer}
.rc-reveal:hover{background:#000}
.rc-grades{margin-top:20px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.rc-grade{padding:18px 6px;border:none;border-radius:14px;cursor:pointer;font:inherit;display:flex;justify-content:center;
  align-items:center;color:#fff;transition:.12s}
.rc-grade:active{transform:translateY(1px)}
.g-label{font-size:16px;font-weight:600}
.rc-grade.again{background:var(--clay)}.rc-grade.hard{background:var(--marigold);color:#3a2600}
.rc-grade.good{background:var(--pine)}.rc-grade.easy{background:var(--mint)}
.rc-empty{padding:56px 20px;text-align:center;color:var(--mut);line-height:1.6}
.rc-empty-big{font-family:Georgia,'Times New Roman',serif;font-size:22px;color:var(--ink);margin-bottom:6px}
.rc-empty-sub{font-size:12px;color:var(--mut)}
.rc-cta{margin-top:18px;padding:13px 22px;border:none;border-radius:12px;background:var(--pine);color:#fff;
  font:inherit;font-size:15px;font-weight:600;cursor:pointer}
.rc-cta.ghost{background:transparent;color:var(--pine);border:1px solid var(--pine)}
.rc-add{padding:22px 0}
.rc-seg{display:flex;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.rc-seg button{flex:1;padding:9px 4px;border:none;background:transparent;border-radius:9px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer;line-height:1.3}
.rc-seg button.on{background:var(--ink);color:#fff}
.rc-form{display:flex;flex-direction:column;gap:8px}
.rc-form label{font-size:13px;color:var(--mut);margin-top:6px}
.rc-form textarea,.rc-form input,.rc-search,.rc-edit textarea,.rc-edit input{width:100%;padding:12px 14px;border:1px solid var(--line);
  border-radius:11px;font:inherit;font-size:15px;background:var(--surface);color:var(--ink);resize:vertical}
.rc-form textarea:focus,.rc-form input:focus,.rc-search:focus{outline:2px solid var(--marigold);outline-offset:-1px;border-color:transparent}
.rc-msg{margin-top:14px;background:var(--amber-soft);color:#6a4a06;padding:10px 14px;border-radius:10px;font-size:14px}
.rc-instr-row{display:flex;justify-content:flex-end;margin-bottom:2px}
.rc-instr-btn{display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);
  border-radius:9px;padding:7px 11px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer}
.rc-modal-overlay{position:fixed;inset:0;background:rgba(35,32,26,0.55);display:flex;align-items:center;
  justify-content:center;padding:24px;z-index:50}
.rc-modal-card{width:100%;max-width:330px;background:var(--surface);border-radius:20px;padding:22px;
  display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.rc-modal-head{display:flex;align-items:center;justify-content:space-between}
.rc-modal-title{font-size:17px;font-weight:700;color:var(--ink)}
.rc-modal-close{background:none;border:none;font-size:16px;color:var(--mut);cursor:pointer;padding:4px}
.rc-modal-desc{font-size:12px;color:var(--mut);line-height:1.6;margin:0}
.rc-modal-textarea{border:1px solid var(--line);border-radius:10px;padding:12px;min-height:120px;
  font:inherit;font-size:13px;line-height:1.7;color:var(--ink);background:var(--paper);resize:vertical}
.rc-modal-textarea:focus{outline:2px solid var(--marigold);outline-offset:-1px}
.rc-modal-actions{display:flex;gap:8px}
.rc-modal-actions .rc-cta{flex:1}
.rc-modal-actions .rc-mini{flex:1;text-align:center}
.rc-pastezone{border:2px dashed var(--line);background:var(--paper);color:var(--mut);text-align:center;
  padding-top:10px;font-size:14px;resize:none;cursor:text}
.rc-pastezone:focus{outline:2px solid var(--marigold);outline-offset:-1px;border-style:solid;border-color:transparent}
.rc-gridwrap{margin-top:16px;overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.rc-grid{border-collapse:collapse;width:100%;min-width:640px;font-size:14px}
.rc-grid th{background:var(--paper);color:var(--mut);font-weight:600;font-size:12px;text-align:left;
  padding:8px 10px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}
.rc-grid th:last-child,.rc-grid td:last-child{border-right:none;width:1%}
.rc-grid td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0}
.rc-grid tr:last-child td{border-bottom:none}
.rc-grid tr.rc-row-warn td:first-child,.rc-grid tr.rc-row-warn td:nth-child(2){background:#fdecea}
.rc-grid input{width:100%;border:none;background:transparent;padding:9px 10px;font:inherit;font-size:14px;
  color:var(--ink);min-width:120px}
.rc-grid input:focus{outline:2px solid var(--marigold);outline-offset:-2px}
.rc-grid textarea{width:100%;border:none;background:transparent;padding:9px 10px;font:inherit;font-size:14px;
  color:var(--ink);min-width:160px;resize:vertical;line-height:1.5}
.rc-grid textarea:focus{outline:2px solid var(--marigold);outline-offset:-2px}
.rc-grid td:last-child{padding:4px 8px}
.rc-grid-actions{display:flex;gap:8px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.rc-list{padding:18px 0}
.rc-search{margin-bottom:10px}
.rc-sort{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mut);margin-bottom:14px;flex-wrap:wrap}
.rc-sort button{padding:5px 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;font:inherit;font-size:12px;color:var(--mut);cursor:pointer}
.rc-sort button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rc-bulkbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px;
  padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:20px}
.rc-bulk-count{font-size:13px;font-weight:600;color:var(--ink);margin-right:2px}
.rc-bulk-warn{font-size:13px;color:var(--clay)}
.rc-mini:disabled{opacity:.4;cursor:not-allowed}
.rc-item.selectable{align-items:flex-start}
.rc-checkbox{flex:none;display:flex;align-items:center;padding-top:2px}
.rc-checkbox input{width:18px;height:18px;accent-color:var(--pine);cursor:pointer}
.rc-item.selectable .rc-item-main{cursor:pointer}
.rc-item{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:10px;display:flex;gap:12px;justify-content:space-between}
.rc-item-main{flex:1;min-width:0}
.rc-item-ko{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-weight:700;font-size:16px}
.rc-item-es{font-family:Georgia,'Times New Roman',serif;font-size:16px;color:var(--pine);margin-top:3px}
.rc-item-pron{font-size:13px;color:var(--marigold);font-weight:500;margin-top:3px}
.rc-item-note{font-size:13px;color:var(--mut);margin-top:4px;display:flex;gap:6px;align-items:flex-start;white-space:pre-line}
.rc-sublabel{font-size:12px;color:var(--mut);margin-top:-2px !important}
.rc-item-meta{display:flex;align-items:center;gap:12px;margin-top:10px;font-size:12px;color:var(--mut);flex-wrap:wrap;font-variant-numeric:tabular-nums}
.rc-fresh{color:var(--mint)}.rc-lapse{color:var(--clay)}
.rc-item-actions{display:flex;flex-direction:column;gap:6px;flex:none}
.rc-mini{padding:7px 10px;border:1px solid var(--line);background:var(--paper);border-radius:9px;font:inherit;font-size:12px;color:var(--ink);cursor:pointer;white-space:nowrap}
.rc-mini.ghost{color:var(--mut)}.rc-mini.danger{color:var(--clay);border-color:#eecfc8}
.rc-edit{flex:1;display:flex;flex-direction:column;gap:8px}
.rc-edit-actions{display:flex;gap:8px}
.rc-settings{padding:22px 0}
.rc-h3{font-family:Georgia,'Times New Roman',serif;font-size:18px;margin:0 0 8px}
.rc-h3:not(:first-child){margin-top:28px}
.rc-p{font-size:14px;line-height:1.65;color:var(--mut);margin:0}
.rc-targets{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rc-voice-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.rc-voice-grid .rc-target{padding:10px}
.rc-voice-grid .t-name{font-size:13px}
.rc-voice-grid .t-desc{font-size:11px}
.rc-goalset-row{display:flex;align-items:center;gap:8px;margin-top:14px}
.rc-goalset-input{width:80px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:16px;text-align:center;background:var(--surface);color:var(--ink)}
.rc-goalset-input:focus{outline:2px solid var(--marigold);outline-offset:-1px;border-color:transparent}
.rc-goalset-unit{font-size:14px;color:var(--mut)}
.rc-goalset-current{margin-top:8px;font-size:12px;color:var(--mut)}
.rc-target{text-align:left;padding:14px;border:1px solid var(--line);background:var(--surface);border-radius:14px;cursor:pointer;
  display:flex;flex-direction:column;gap:3px;transition:.15s}
.rc-target.on{border-color:var(--pine);background:#eef6f4;box-shadow:0 0 0 1px var(--pine) inset}
.t-pct{font-family:Georgia,'Times New Roman',serif;font-size:22px;font-weight:600;color:var(--pine)}
.t-name{font-size:14px;font-weight:600;color:var(--ink)}
.t-desc{font-size:12px;color:var(--mut)}
.rc-p-mut{font-size:13px}
.rc-filebox{margin-top:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;
  background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.rc-file-row{display:flex;align-items:center;gap:10px;min-width:0}
.rc-file-dot{width:9px;height:9px;border-radius:50%;background:var(--marigold);flex:none}
.rc-file-dot.on{background:var(--mint)}
.rc-file-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:220px}
.rc-file-state{font-size:12px;color:var(--mut)}
.rc-file-actions{display:flex;gap:8px;flex-wrap:wrap}
.rc-apikey-row{display:flex;gap:8px;margin-top:10px}
.rc-tts-label{display:block;font-size:12px;color:var(--mut);margin-top:14px;margin-bottom:6px}
.rc-tts-label-sub{font-weight:400;color:var(--mut);font-size:11px}

.rc-ask-result-wrap{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.rc-ask-result{display:flex;flex-direction:column;gap:12px}
.rc-ask-message{font-size:14px;line-height:1.65;color:var(--ink);white-space:pre-line;margin:0}
.rc-ask-phrases{display:flex;flex-direction:column;gap:10px}

.rc-phrase-list{display:flex;flex-direction:column;gap:8px}
.rc-phrase-card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px}
.rc-phrase-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rc-phrase-es{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:17px;color:var(--pine);flex:1;line-height:1.35}
.rc-phrase-pron{margin-top:4px;font-size:12px;color:var(--marigold);font-weight:500}
.rc-phrase-ko{margin-top:5px;font-size:12px;color:var(--mut)}

.rc-dialogue-play{display:flex;align-items:center;gap:8px}
.rc-mini.on{background:var(--pine);color:#fff;border-color:var(--pine)}

.rc-chat{display:flex;flex-direction:column;gap:10px}
.rc-chat-bubble{display:flex;flex-direction:column;max-width:84%}
.rc-chat-bubble.left{align-self:flex-start;align-items:flex-start}
.rc-chat-bubble.right{align-self:flex-end;align-items:flex-end}
.rc-chat-speaker{font-size:10px;font-weight:700;color:var(--mut);margin-bottom:3px;padding:0 4px}
.rc-chat-row{display:flex;align-items:flex-end;gap:8px}
.rc-chat-bubble.right .rc-chat-row{flex-direction:row-reverse}
.rc-chat-text{border-radius:16px;padding:10px 14px;background:var(--surface);border:1px solid var(--line)}
.rc-chat-bubble.right .rc-chat-text{background:#eef6f4;border-color:#cfe6e0}
.rc-chat-es{font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:15px;color:var(--pine);line-height:1.35}
.rc-chat-pron{margin-top:3px;font-size:11px;color:var(--marigold);font-weight:500}
.rc-chat-ko{margin-top:4px;font-size:11px;color:var(--mut)}

.rc-bookmarks{display:flex;flex-direction:column;gap:16px;padding:18px 0}
.rc-bookmark-controls{display:flex;flex-direction:column;gap:8px;margin-bottom:4px}
.rc-bookmark-search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:13px;background:var(--surface);color:var(--ink);box-sizing:border-box}
.rc-bookmark-search:focus{outline:2px solid var(--marigold);outline-offset:-1px;border-color:transparent}
.rc-bookmark-sort{margin-bottom:0}
.rc-bookmark-sort button{flex:1}
.rc-bookmark-item{border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--surface);
  display:flex;flex-direction:column;gap:14px}
.rc-bookmark-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rc-bookmark-title-btn{display:flex;align-items:flex-start;gap:8px;background:none;border:none;padding:0;
  cursor:pointer;text-align:left;flex:1;min-width:0}
.rc-bookmark-caret{color:var(--mut);font-size:13px;line-height:1.5;flex:none}
.rc-bookmark-q{font-size:14px;font-weight:700;color:var(--ink);line-height:1.4}
.rc-bookmark-date{margin-top:3px;font-size:11px;color:var(--mut)}
.rc-bookmark-rename-row{display:flex;align-items:center;gap:8px;flex:1}
.rc-bookmark-rename-input{flex:1;padding:8px 10px;border:1px solid var(--line);border-radius:9px;
  font:inherit;font-size:14px;background:var(--paper);color:var(--ink)}
.rc-mini.danger{color:var(--clay);border-color:var(--clay)}
.rc-tts-input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:13px;background:var(--surface);color:var(--ink)}
.rc-tts-input:focus{outline:2px solid var(--marigold);outline-offset:-1px;border-color:transparent}
.rc-apikey-row input{flex:1;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  font:inherit;font-size:14px;background:var(--surface);color:var(--ink)}
.rc-apikey-row input:focus{outline:2px solid var(--marigold);outline-offset:-1px;border-color:transparent}
.rc-apikey-ok{font-size:12px;color:var(--pine);font-weight:600;align-self:center}
.rc-stat{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.rc-stat>div{min-width:78px}
.rc-stat>div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;text-align:center;display:flex;flex-direction:column;gap:4px}
.rc-stat b{font-family:Georgia,'Times New Roman',serif;font-size:22px;color:var(--ink)}
.rc-stat span{font-size:11px;color:var(--mut);line-height:1.3}
.rc-foot{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:11px 16px calc(11px + env(safe-area-inset-bottom, 0px)) 16px;font-size:12px;color:var(--mut);
  transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform;backface-visibility:hidden}
.rc-foot b{color:var(--ink);font-variant-numeric:tabular-nums}
@media (max-width:480px){.rc-ko{font-size:24px}.rc-es{font-size:23px}.rc-item{flex-direction:column}
  .rc-item-actions{flex-direction:row;flex-wrap:wrap}.g-label{font-size:13px}.rc-targets{grid-template-columns:1fr}
  .rc-voice-grid{grid-template-columns:1fr 1fr}}
`);
}

(function(){
  var el = document.getElementById("root");
  var appEl = React.createElement(App);
  if (ReactDOM.createRoot) { ReactDOM.createRoot(el).render(appEl); }
  else { ReactDOM.render(appEl, el); }
})();
</script>

if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
