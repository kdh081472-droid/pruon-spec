    camera: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3Z"/><circle cx="12" cy="13" r="3"/></svg>',
    percent: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>',
    refresh: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M8 16H3v5"/></svg>'
  };

  // ---- 상태 ----
  var state = {
    products: [],
    query: "",
    mode: "search",      // "search" | "admin"
    selectedIds: {},     // id -> true
    addMode: "single",   // "single" | "bulk"
    modal: null,         // null | "pw" | "add" | "bulkDelete" | "viewPhotos" | "managePhotos" | "manageIngredients"
    viewingId: null,      // 사진/원료 관리로 보고 있는 제품 id
    excelRows: null       // 엑셀 업로드 미리보기 데이터
  };

  // 신규 등록 폼에서 선택한 사진들(base64 data URL, 최대 3장) 임시 저장
  var pendingPhotos = []; // [{ data, name }]
  var PHOTO_MAX = 3;

  // 신규 등록 폼에서 입력한 원료 함량 임시 저장
  var pendingIngredients = []; // [{ name, percent }]

  function isUserActivelyEditing() {
    if (state.modal) return true; // 모달(등록/사진/원료 관리 등) 열려 있으면 건드리지 않음
    var el = document.activeElement;
    if (!el) return false;
    var tag = el.tagName;
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";
  }

  var autoRefreshTimer = null;
  function startAutoRefresh() {
    if (autoRefreshTimer) return;
    autoRefreshTimer = setInterval(function () {
      if (!appUnlocked || isUserActivelyEditing()) return;
      fetchProducts(false);
    }, 20000);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && appUnlocked && !isUserActivelyEditing()) {
        fetchProducts(false);
      }
    });
  }

  // ---- 30분마다 자동으로 다시 입장 비밀번호를 물어봄 ----
  var SESSION_LIMIT_MS = 30 * 60 * 1000;
  var sessionLockTimer = null;
  var sessionCountdownTimer = null;
  var sessionDeadline = null;

  function updateCountdownDisplay() {
    var el = document.getElementById("session-countdown");
    if (!el || !sessionDeadline) return;
    var remaining = sessionDeadline - Date.now();
    if (remaining < 0) remaining = 0;
    var mins = Math.floor(remaining / 60000);
    var secs = Math.floor((remaining % 60000) / 1000);
    el.textContent = "자동 로그아웃까지 " + mins + ":" + (secs < 10 ? "0" : "") + secs;
  }

  function startSessionTimer() {
    if (sessionLockTimer) clearTimeout(sessionLockTimer);
    sessionDeadline = Date.now() + SESSION_LIMIT_MS;
    sessionLockTimer = setTimeout(lockApp, SESSION_LIMIT_MS);
    updateCountdownDisplay();
    if (!sessionCountdownTimer) {
      sessionCountdownTimer = setInterval(updateCountdownDisplay, 1000);
    }
  }

  function lockApp() {
    appUnlocked = false;
    sessionGatePw = null;
    sessionAdminPw = null;
    state.mode = "search";
    state.modal = null;
    state.selectedIds = {};
    if (autoRefreshTimer) { clearInterval(autoRefreshTimer); autoRefreshTimer = null; }
    if (sessionLockTimer) { clearTimeout(sessionLockTimer); sessionLockTimer = null; }
    if (sessionCountdownTimer) { clearInterval(sessionCountdownTimer); sessionCountdownTimer = null; }
    sessionDeadline = null;
    var mr = document.getElementById("modal-root");
    if (mr) mr.innerHTML = "";
    renderGate();
    toast("30분 동안 조작이 없어 다시 로그인해주세요.");
  }

  // 클릭/입력/터치가 있을 때마다 30분 타이머를 리셋 (조작 없을 때만 카운트다운)
  function resetSessionTimerIfActive() {
    if (appUnlocked) startSessionTimer();
  }
  document.addEventListener("click", resetSessionTimerIfActive, true);
  document.addEventListener("keydown", resetSessionTimerIfActive, true);
  document.addEventListener("touchstart", resetSessionTimerIfActive, { passive: true, capture: true });

  // ---- 데이터 로드 (Supabase에서 실시간으로) ----
  var isLoading = false;
  async function fetchProducts(showToastOnFail) {
    if (!sessionGatePw) return;
    isLoading = true;
    try {
      var res = await db.rpc("get_products", { pw: sessionGatePw });
      if (res.error) {
        if (showToastOnFail) toast("데이터 조회 오류: " + (res.error.message || JSON.stringify(res.error)));
        return;
      }
      state.products = (res.data || []).map(function (row) {
        return {
          id: row.id, vendor: row.vendor, name: row.name, type: row.type,
          weight: row.weight, note: row.note || "",
          ingredients: row.ingredients || [], photos: row.photos || []
        };
      });
      render();
    } catch (e) {
      if (showToastOnFail) toast("데이터를 불러오지 못했어요. 인터넷 연결을 확인해주세요.");
    } finally {
      isLoading = false;
    }
  }

  // 제품 하나를 서버에 저장(신규/수정 둘 다). 실패하면 알려주고 false 반환
  async function saveProduct(p) {
    if (!sessionAdminPw) { toast("관리자 인증이 만료됐어요. 다시 로그인해주세요."); return false; }
    try {
      var res = await db.rpc("upsert_product", {
        admin_pw: sessionAdminPw,
        p: {
          id: p.id, vendor: p.vendor, name: p.name, type: p.type,
          weight: p.weight, note: p.note || "",
          ingredients: p.ingredients || [], photos: p.photos || []
        }
      });
      if (res.error) { toast("저장 실패: " + res.error.message); return false; }
      return true;
    } catch (e) {
      toast("저장 중 문제가 생겼어요. 인터넷 연결을 확인해주세요.");
      return false;
    }
  }

  async function deleteProductRemote(id) {
    if (!sessionAdminPw) { toast("관리자 인증이 만료됐어요. 다시 로그인해주세요."); return false; }
    try {
      var res = await db.rpc("delete_product", { admin_pw: sessionAdminPw, product_id: id });
      if (res.error) { toast("삭제 실패: " + res.error.message); return false; }
      return true;
    } catch (e) {
      toast("삭제 중 문제가 생겼어요. 인터넷 연결을 확인해주세요.");
      return false;
    }
  }

  // 관리자 비밀번호를 서버에서 확인 (맞으면 sessionAdminPw 저장)
  async function tryAdminLogin(value) {
    try {
      var res = await db.rpc("check_admin", { pw: value });
      if (res.error) { toast("서버 오류: " + (res.error.message || JSON.stringify(res.error))); return false; }
      if (res.data === true) {
        sessionAdminPw = value;
        return true;
      }
      return false;
    } catch (e) {
      toast("서버에 연결하지 못했어요.");
      return false;
    }
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  // ---- 검색: 단어 순서 무관 ----
  function matches(p, q) {
    var tokens = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
    if (tokens.length === 0) return true;
    var hay = (p.name + " " + p.vendor + " " + p.type + " " + (p.note || "")).toLowerCase();
    return tokens.every(function (t) { return hay.indexOf(t) !== -1; });
  }

  function filteredList() {
    if (!state.query.trim()) return [];
    return state.products.filter(function (p) { return matches(p, state.query); });
  }
  function manageList() {
    if (!state.query.trim()) return state.products;
    return state.products.filter(function (p) { return matches(p, state.query); });
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.add("hidden"); }, 2600);
  }

  // ---- 전체 잠금 화면 ----
  function renderGate() {
    var app = document.getElementById("app");
    app.innerHTML =
      '<div style="min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px;padding:20px 16px;">' +
      '<div class="pw-icon">' + ICON.lock + '</div>' +
      '<div class="confirm-title">비밀번호 확인</div>' +
      '<div class="confirm-text">사내 제품 스펙 자료예요.<br />비밀번호를 입력해주세요.</div>' +
      '<input id="gate-pw" class="field-input" type="password" inputmode="numeric" placeholder="••••" style="text-align:center;letter-spacing:0.3em;font-size:18px;max-width:220px" />' +
      '<div id="gate-err" class="pw-err-text hidden">비밀번호가 올바르지 않아요.</div>' +
      '<button class="ok-btn" style="margin-top:14px;max-width:220px;width:100%" data-act="submitGate">입장</button>' +
      '</div>';
    setTimeout(function () { var i = document.getElementById("gate-pw"); if (i) i.focus(); }, 30);
  }

  function renderGateWarning(count) {
    var wrap = document.getElementById("modal-root");
    if (!wrap) return;
    var remaining = MAX_GATE_FAILS - count;
    wrap.innerHTML =
      '<div class="overlay center" data-act="closeGateWarning">' +
      '<div class="confirm-box" data-stop="1">' +
      '<div class="confirm-title">비밀번호가 틀렸어요</div>' +
      '<div class="confirm-text">연속 <strong>' + count + '/' + MAX_GATE_FAILS + '회</strong> 틀렸어요.<br />' +
      MAX_GATE_FAILS + '회 연속 틀리면 <strong>모든 제품 데이터가 삭제</strong>돼요.<br />(앞으로 ' + remaining + '번 더 틀리면 삭제)</div>' +
      '<button class="ok-btn" style="width:100%;margin-top:10px" data-act="closeGateWarning">확인</button>' +
      '</div></div>';
  }

  function renderGateWiped() {
    var wrap = document.getElementById("modal-root");
    if (!wrap) return;
    wrap.innerHTML =
      '<div class="overlay center" data-act="closeGateWiped">' +
      '<div class="confirm-box" data-stop="1">' +
      '<div class="confirm-title">데이터가 삭제됐어요</div>' +
      '<div class="confirm-text">비밀번호를 ' + MAX_GATE_FAILS + '회 연속 틀려서 등록돼 있던 모든 제품 데이터가 삭제됐어요.</div>' +
      '<button class="ok-btn" style="width:100%;margin-top:10px" data-act="closeGateWiped">확인</button>' +
      '</div></div>';
  }

  async function handleGateAttempt(value) {
    var btn = document.querySelector('[data-act="submitGate"]');
    if (btn) { btn.disabled = true; btn.textContent = "확인 중..."; }
    try {
      var res = await db.rpc("check_gate", { pw: value });
      if (res.error) {
        toast("서버 오류: " + (res.error.message || JSON.stringify(res.error)));
        return;
      }
      var result = res.data;
      if (result && result.ok) {
        sessionGatePw = value;
        appUnlocked = true;
        await fetchProducts(true);
        render();
        startAutoRefresh();
        startSessionTimer();
        return;
      }
      if (result && result.wiped) {
        state.products = [];
        appUnlocked = false;
        sessionGatePw = null;
        renderGateWiped();
      } else {
        var gel = document.getElementById("gate-err");
        if (gel) gel.classList.remove("hidden");
        renderGateWarning(result ? result.fail_count : 0);
      }
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "입장"; }
    }
  }

  // ---- 렌더 ----
  function render() {
    var app = document.getElementById("app");
    var html = "";

    // 헤더
    html += '<header>';
    html += '<div class="header-left"><div class="stamp">' + ICON.pkg + '</div>';
    html += '<div><div class="eyebrow">제품 스펙 조회</div><h1>제품 · 알당중량 검색</h1>';
    html += '<div class="session-countdown" id="session-countdown"></div>';
    html += '</div></div>';
    if (state.mode === "admin") {
      html += '<div class="header-btns">';
      html += '<button class="btn-export" data-act="manualRefresh">' + ICON.refresh + '</button>';
      html += '<button class="btn-export" data-act="export">' + ICON.download + '백업</button>';
      html += '<button class="btn-add" data-act="openAdd">' + ICON.plus + '등록</button>';
      html += '<button class="btn-done" data-act="exitAdmin">완료</button>';
      html += '</div>';
    } else {
      html += '<div class="header-btns">';
      html += '<button class="btn-export" data-act="manualRefresh">' + ICON.refresh + '</button>';
      html += '<button class="btn-admin" data-act="openPw">' + ICON.lock + '관리자</button>';
      html += '</div>';
    }
    html += '</header>';

    if (state.mode === "admin") {
      html += '<div class="admin-banner">' + ICON.lock + '관리자 모드 — 등록·삭제·수정 사항은 즉시 서버에 저장돼요</div>';
    }

    // 검색바
    var ph = state.mode === "admin" ? "관리할 제품 검색" : "제품명, 업체명, 비고로 검색";
    html += '<div class="search-wrap">' + ICON.search;
    html += '<input id="search-input" type="text" placeholder="' + ph + '" value="' + esc(state.query) + '" />';
    if (state.query) html += '<button class="clear-btn" data-act="clearSearch">' + ICON.x + '</button>';
    html += '</div>';

    // 본문
    html += '<div id="body-root">';
    if (state.mode === "admin") {
      html += renderManage();
    } else {
      html += renderSearch();
    }
    html += '</div>';

    app.innerHTML = html;

    // 플로팅 삭제 바
    var selCount = Object.keys(state.selectedIds).length;
    var fb = document.getElementById("float-bar");
    if (fb) fb.remove();
    if (state.mode === "admin" && selCount > 0) {
      var bar = document.createElement("div");
      bar.id = "float-bar";
      bar.className = "float-bar";
      bar.innerHTML = '<button class="float-del" data-act="askBulkDelete">' + ICON.trash + '선택한 ' + selCount + '개 삭제</button>';
      document.body.appendChild(bar);
    }

    // 검색 입력 포커스 유지
    var si = document.getElementById("search-input");
    if (si && state._focusSearch) {
      si.focus();
      var v = si.value; si.value = ""; si.value = v; // 커서 끝으로
    }
    state._focusSearch = false;
  }

  // 검색 결과만 갱신 (입력창은 그대로 두어 한글 조합 유지)
  function updateResultsOnly() {
    var body = document.getElementById("body-root");
    if (body) {
      body.innerHTML = state.mode === "admin" ? renderManage() : renderSearch();
    }
    // clear 버튼 표시/숨김 (입력창은 건드리지 않음)
    var sw = document.querySelector(".search-wrap");
    if (sw) {
      var existing = sw.querySelector(".clear-btn");
      if (state.query && !existing) {
        var b = document.createElement("button");
        b.className = "clear-btn";
        b.setAttribute("data-act", "clearSearch");
        b.innerHTML = ICON.x;
        sw.appendChild(b);
      } else if (!state.query && existing) {
        existing.remove();
      }
    }
  }

  function renderSearch() {
    if (!state.query.trim()) {
      return '<div class="empty">' + ICON.layers +
        '<p>제품명·업체명·비고 어느 걸로 검색해도 돼요.<br />단어 순서가 달라도 찾아드려요.</p>' +
        '<div class="count-pill">등록된 제품 ' + state.products.length + '개</div></div>';
    }
    var list = filteredList();
    if (list.length === 0) {
      return '<div class="empty"><p>&quot;' + esc(state.query) + '&quot;와 일치하는 제품이 없어요.</p></div>';
    }
    var h = '<div class="results">';
    list.forEach(function (p) {
      h += '<div class="card">';
      h += '<div class="card-top"><span class="card-name">' + esc(p.name) + '</span><span class="card-vendor">' + esc(p.vendor) + '</span></div>';
      h += '<div class="spec-row"><span class="spec-tag">' + esc(p.type) + '</span><span class="spec-weight">' + esc(p.weight) + 'g / 알</span></div>';
      if (p.ingredients && p.ingredients.length) {
        h += '<div class="ing-row">';
        p.ingredients.forEach(function (ing) {
          h += '<span class="ing-tag">' + esc(ing.name) + ' ' + esc(ing.percent) + '%</span>';
        });
        h += '</div>';
      }
      if (p.note && p.note.trim()) {
        h += '<div class="note-box"><span class="note-label">비고</span><span class="note-text">' + esc(p.note) + '</span></div>';
      }
      if (p.photos && p.photos.length) {
        h += '<button class="btn-photo" data-act="viewPhotos" data-id="' + esc(p.id) + '">' + ICON.camera + '사진 보기 (' + p.photos.length + ')</button>';
      }
      h += '</div>';
    });
    h += '</div>';
    return h;
  }

  function renderManage() {
    var list = manageList();
    var allSel = list.length > 0 && list.every(function (p) { return state.selectedIds[p.id]; });
    var selCount = Object.keys(state.selectedIds).length;
    var h = '<div class="manage-bar">';
    h += '<button class="select-all" data-act="toggleAll">' + (allSel ? "전체 해제" : "전체 선택") + '</button>';
    h += '<span class="manage-count">' + selCount + '개 선택됨</span></div>';
    h += '<div class="results">';
    list.forEach(function (p) {
      var on = !!state.selectedIds[p.id];
      h += '<div class="mcard' + (on ? " sel" : "") + '">';
      h += '<div class="mcard-top">';
      h += '<div class="checkbox' + (on ? " on" : "") + '" data-act="toggleSel" data-id="' + esc(p.id) + '">' + (on ? ICON.check : "") + '</div>';
      h += '<div style="flex:1;min-width:0">';
      h += '<input class="mcard-name-input" data-field-id="' + esc(p.id) + '" data-field="name" value="' + esc(p.name) + '" />';

  // 원료 한 줄 파싱: "돼지고기\t35" / "돼지고기, 35" / "돼지고기 35" / "돼지고기 35%" / "돼지고기: 35%" 모두 지원
  function parseIngredientLine(line) {
    line = line.trim();
    if (!line) return null;
    var cols = null;
    if (line.indexOf("\t") !== -1) cols = line.split("\t");
    else if (line.indexOf(",") !== -1) cols = line.split(",");
    var name, pctRaw;
    if (cols && cols.length >= 2) {
      name = (cols[0] || "").trim();
      pctRaw = (cols[1] || "").trim();
    } else {
      var m = line.match(/^(.*?)[:\s]+([\d.]+)\s*%?$/);
      if (m) { name = m[1].trim(); pctRaw = m[2].trim(); } else { name = line; pctRaw = ""; }
    }
    pctRaw = pctRaw.replace("%", "").trim();
    var pct = parseFloat(pctRaw);
    return { name: name, percent: pct, valid: !!name && !isNaN(pct) };
  }

  function parseIngredientBulk(text) {
    return text.split("\n")
      .map(function (l) { return l.replace(/\r/g, ""); })
      .filter(function (l) { return l.trim().length > 0; })
      .map(parseIngredientLine)
      .filter(Boolean);
  }

  // ---- 엑셀 파일 업로드로 일괄 등록/수정 ----
  var EXCEL_HEADER_ALIASES = {
    id: ["id", "ID", "아이디"],
    vendor: ["업체명", "업체"],
    name: ["제품명", "제품", "품명"],
    type: ["구분", "종류"],
    weight: ["알당중량", "알당중량(g)", "중량", "중량(g)", "중량(그램)"],
    note: ["비고", "메모"],
    ingredients: ["원료", "원료함량", "원료(함량)"]
  };

  function mapExcelRow(row) {
    var out = {};
    Object.keys(row).forEach(function (key) {
      var k = String(key || "").trim();
      Object.keys(EXCEL_HEADER_ALIASES).forEach(function (field) {
        if (out[field] === undefined && EXCEL_HEADER_ALIASES[field].indexOf(k) !== -1) {
          out[field] = row[key];
        }
      });
    });
    return out;
  }

  function parseIngredientsCell(text) {
    if (!text) return [];
    return String(text).split(",").map(function (s) { return s.trim(); }).filter(Boolean)
      .map(function (entry) {
        var m = entry.match(/^(.*?)[:\s]+([\d.]+)\s*%?$/);
        if (!m) return null;
        return { name: m[1].trim(), percent: parseFloat(m[2]) };
      }).filter(function (x) { return x && x.name && !isNaN(x.percent); });
  }

  function buildExcelRows(jsonRows) {
    return jsonRows.map(function (raw, idx) {
      var f = mapExcelRow(raw);
      var idRaw = f.id !== undefined && String(f.id).trim() !== "" ? String(f.id).trim() : "";
      var vendor = f.vendor !== undefined ? String(f.vendor).trim() : "";
      var name = f.name !== undefined ? String(f.name).trim() : "";
      var type = f.type !== undefined ? String(f.type).trim() : "";
      var weightNum = parseFloat(f.weight);
      var noteRaw = f.note !== undefined ? String(f.note).trim() : "";
      var ingRaw = f.ingredients !== undefined ? String(f.ingredients).trim() : "";

      var errors = [];
      if (!name) errors.push("제품명 없음");
      if (!weightNum || isNaN(weightNum)) errors.push("중량 숫자 아님");
      if (TYPES.indexOf(type) === -1) errors.push('구분 "' + (type || "-") + '" 인식 불가');

      var matchedProduct = idRaw ? state.products.filter(function (x) { return x.id === idRaw; })[0] : null;

      return {
        rowIndex: idx + 1,
        idRaw: idRaw,
        vendor: vendor,
        name: name,
        type: type,
        weightNum: weightNum,
        note: noteRaw !== "" ? noteRaw : undefined,
        ingredients: ingRaw !== "" ? parseIngredientsCell(ingRaw) : undefined,
        matchedProduct: matchedProduct || null,
        action: matchedProduct ? "update" : "new",
        valid: errors.length === 0,
        errors: errors
      };
    });
  }

  function renderExcelTab() {
    var h = '<div class="bulk-hint">엑셀 파일(.xlsx)을 업로드해서 여러 제품을 한 번에 등록·수정할 수 있어요.<br />열 이름: <strong>id(선택) · 업체명 · 제품명 · 구분 · 알당중량 · 비고 · 원료</strong><br /><strong>id가 기존 제품과 일치하면 수정</strong>, 없으면 신규 등록돼요. 원료 칸은 &quot;돼지고기:35,양배추:20&quot; 형식으로 입력하세요.</div>';
    h += '<div class="excel-action-row">';
    h += '<button type="button" class="excel-action-btn" data-act="downloadExcelTemplate">' + ICON.download + '템플릿 받기</button>';
    h += '<button type="button" class="excel-action-btn" data-act="exportExcelCurrent">' + ICON.download + '현재 데이터 받기</button>';
    h += '</div>';
    h += '<button type="button" class="excel-pick-btn" data-act="pickExcelFile">' + ICON.upload + '엑셀 파일 선택</button>';
    h += '<input type="file" id="f-excel" class="hidden" accept=".xlsx,.xls,.csv" />';

    if (state.excelRows && state.excelRows.length) {
      var rows = state.excelRows;
      var newCount = rows.filter(function (r) { return r.valid && r.action === "new"; }).length;
      var updCount = rows.filter(function (r) { return r.valid && r.action === "update"; }).length;
      var errCount = rows.filter(function (r) { return !r.valid; }).length;
      h += '<div class="excel-summary-row">';
      h += '<div class="excel-summary-pill new"><span class="excel-summary-num">' + newCount + '</span>신규 등록</div>';
      h += '<div class="excel-summary-pill upd"><span class="excel-summary-num">' + updCount + '</span>기존 수정</div>';
      h += '<div class="excel-summary-pill err"><span class="excel-summary-num">' + errCount + '</span>오류(건너뜀)</div>';
      h += '</div>';
      h += '<div class="bulk-list">';
      rows.forEach(function (r) {
        h += '<div class="bulk-row' + (r.valid ? "" : " err") + '"><span class="bulk-num">' + r.rowIndex + '</span>';
        h += '<span class="bulk-text">' + (r.valid ? (r.action === "update" ? "[수정] " : "[신규] ") : "") +
          esc(r.vendor || "-") + ' · ' + esc(r.name || "(제품명 없음)") + ' · ' + esc(r.type || "-") +
          (isNaN(r.weightNum) ? "" : " · " + esc(r.weightNum) + "g") + '</span>';
        if (!r.valid) h += '<span class="bulk-err-text">' + esc(r.errors.join(", ")) + '</span>';
        h += '</div>';
      });
      h += '</div>';
      h += '<button type="button" class="submit-btn" data-act="applyExcelImport">' + (newCount + updCount) + '개 적용하기</button>';
      h += '<button type="button" class="cancel-btn" style="width:100%;margin-top:8px" data-act="resetExcelImport">다시 선택</button>';
    }
    return h;
  }

  // ---- 엑셀 파싱 ----
  function parseBulk(text) {
    if (!text.trim()) return [];
    return text.split("\n").map(function (l) { return l.replace(/\r/g, ""); })
      .filter(function (l) { return l.trim().length > 0; })
      .map(function (line, idx) {
        var cols = line.indexOf("\t") !== -1 ? line.split("\t") : line.split(",");
        cols = cols.map(function (c) { return (c || "").trim(); });
        var vendor = cols[0], name = cols[1], typeRaw = cols[2], weightRaw = cols[3], noteRaw = cols[4];
        var weight = parseFloat(weightRaw);
        var typeMatch = TYPES.indexOf(typeRaw) !== -1 ? typeRaw : null;
        var errors = [];
        if (!name) errors.push("제품명 없음");
        if (!typeMatch) errors.push('구분 "' + (typeRaw || "-") + '" 인식 불가');
        if (!weightRaw || isNaN(weight)) errors.push("중량 숫자 아님");
        return {
          rowIndex: idx + 1,
          vendor: vendor || "미기입",
          name: name || "",
          type: typeMatch || typeRaw || "",
          weight: weight,
          note: noteRaw || "",
          valid: errors.length === 0,
          errors: errors
        };
      });
  }

  function updateBulkPreview() {
    var ta = document.getElementById("bulk-text");
    var box = document.getElementById("bulk-preview");
    if (!ta || !box) return;
    var rows = parseBulk(ta.value);
    var valid = rows.filter(function (r) { return r.valid; });
    var btn = document.querySelector('[data-act="submitBulk"]');
    if (btn) {
      btn.textContent = valid.length > 0 ? valid.length + "개 일괄 등록" : "일괄 등록";
      btn.style.opacity = valid.length === 0 ? "0.5" : "1";
    }
    if (rows.length === 0) { box.innerHTML = ""; return; }
    var h = '<div class="bulk-preview-header">미리보기 — 총 ' + rows.length + '행 중 ' + valid.length + '행 등록 가능</div><div class="bulk-list">';
    rows.forEach(function (r) {
      h += '<div class="bulk-row' + (r.valid ? "" : " err") + '"><span class="bulk-num">' + r.rowIndex + '</span>';
      h += '<span class="bulk-text">' + esc(r.vendor) + ' · ' + esc(r.name || "(제품명 없음)") + ' · ' + esc(r.type || "-") + ' · ' + (isNaN(r.weight) ? "-" : esc(r.weight) + "g") + (r.note ? ' · 비고: ' + esc(r.note) : "") + '</span>';
      if (!r.valid) h += '<span class="bulk-err-text">' + esc(r.errors.join(", ")) + '</span>';
      h += '</div>';
    });
    h += '</div>';
    box.innerHTML = h;
  }

  // ---- 액션 ----
  function nextId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  async function submitSingle() {
    var name = (document.getElementById("f-name").value || "").trim();
    var weightRaw = (document.getElementById("f-weight").value || "").trim();
    if (!name || !weightRaw) { toast("제품명과 알당중량을 입력해주세요."); return; }
    var p = {
      id: nextId(),
      vendor: (document.getElementById("f-vendor").value || "").trim() || "미기입",
      name: name,
      type: document.getElementById("f-type").value,
      weight: parseFloat(weightRaw),
      note: (document.getElementById("f-note").value || "").trim(),
      ingredients: pendingIngredients.slice(),
      photos: pendingPhotos.map(function (ph) { return ph.data; })
    };
    var btn = document.querySelector('[data-act="submitSingle"]');
    if (btn) { btn.disabled = true; btn.textContent = "저장 중..."; }
    var ok = await saveProduct(p);
    if (btn) { btn.disabled = false; btn.textContent = "등록하기"; }
    if (!ok) return;
    state.products.unshift(p);
    state.modal = null;
    pendingPhotos = [];
    pendingIngredients = [];
    toast('"' + p.name + '" 추가됨');
    render(); renderModal();
  }

  async function submitBulk() {
    var ta = document.getElementById("bulk-text");
    var rows = parseBulk(ta ? ta.value : "");
    var valid = rows.filter(function (r) { return r.valid; });
    if (valid.length === 0) { toast("등록 가능한 행이 없어요. 형식을 확인해주세요."); return; }
    var btn = document.querySelector('[data-act="submitBulk"]');
    if (btn) { btn.disabled = true; btn.textContent = "저장 중..."; }
    var newProducts = valid.map(function (r) {
      return { id: nextId(), vendor: r.vendor, name: r.name, type: r.type, weight: r.weight, note: r.note, ingredients: [], photos: [] };
    });
    var results = await Promise.all(newProducts.map(function (p) { return saveProduct(p); }));
    if (btn) { btn.disabled = false; btn.textContent = "일괄 등록"; }
    var succeeded = newProducts.filter(function (p, i) { return results[i]; });
    succeeded.forEach(function (p) { state.products.unshift(p); });
    var failedCount = newProducts.length - succeeded.length;
    state.modal = null; state.addMode = "single";
    toast(succeeded.length + "개 일괄 등록됨" + (failedCount ? ", " + failedCount + "개 실패" : ""));
    render(); renderModal();
  }

  async function confirmBulkDelete() {
    var ids = Object.keys(state.selectedIds);
    var results = await Promise.all(ids.map(function (id) { return deleteProductRemote(id); }));
    var succeededIds = ids.filter(function (id, i) { return results[i]; });
    state.products = state.products.filter(function (p) { return succeededIds.indexOf(p.id) === -1; });
    var failedCount = ids.length - succeededIds.length;
    state.selectedIds = {};
    state.modal = null;
    toast(succeededIds.length + "개 삭제됨" + (failedCount ? ", " + failedCount + "개 실패" : ""));
    render(); renderModal();
  }

  function exportBackup() {
    var json = JSON.stringify(state.products, null, 2);
    var blob = new Blob([json], { type: "application/json;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    var d = new Date();
    var stamp = d.getFullYear() + ("0" + (d.getMonth() + 1)).slice(-2) + ("0" + d.getDate()).slice(-2);
    a.href = url; a.download = "제품데이터_백업_" + stamp + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    toast("백업 파일을 저장했어요. (데이터는 이미 서버에 실시간 저장돼 있어요)");
  }

      (async function () {
        var toSave = [];

          if (!row.valid) return;

            var mp2 = row.matchedProduct;
            if (row.vendor) mp2.vendor = row.vendor;
            mp2.name = row.name;

            mp2.weight = row.weightNum;
            if (row.note !== undefined) mp2.note = row.note;
            if (row.ingredients !== undefined) mp2.ingredients = row.ingredients;

            };

        var results = await Promise.all(toSave.map(function (item) { return saveProduct(item.product); }));

          else { updN++; }

        state.excelRows = null;
        state.modal = null;

  function readFileAsDataUrl(file) {
    return new Promise(function (resolve, reject) {
      var reader = new FileReader();
      reader.onload = function () { resolve(reader.result); };
      reader.onerror = function () { reject(new Error("read failed")); };
      reader.readAsDataURL(file);

      if (!xf) return;
      if (!window.XLSX) { toast("엑셀 기능을 불러오지 못했어요. 인터넷 연결을 확인해주세요."); el.value = ""; return; }
      var xreader = new FileReader();
      xreader.onload = function () {
        try {
          var wb = XLSX.read(new Uint8Array(xreader.result), { type: "array" });
          var wsName = wb.SheetNames[0];
          var jsonRows = XLSX.utils.sheet_to_json(wb.Sheets[wsName], { defval: "" });
          if (!jsonRows.length) { toast("시트에서 데이터를 찾지 못했어요."); return; }
          state.excelRows = buildExcelRows(jsonRows);
          renderModal();
        } catch (err) {
          toast("엑셀 파일을 읽는 중 문제가 생겼어요. 형식을 확인해주세요.");
        }
      };
      xreader.onerror = function () { toast("파일을 읽는 중 문제가 생겼어요."); };
      xreader.readAsArrayBuffer(xf);
      el.value = "";
      return;
    }

    var isNew = el.id === "f-photos";
    var targetId = el.getAttribute("data-photo-target");
    if (!isNew && !targetId) return;

    var files = el.files ? Array.prototype.slice.call(el.files) : [];
    if (!files.length) return;

    var currentCount = isNew ? pendingPhotos.length :
      (function () { var p = state.products.filter(function (x) { return x.id === targetId; })[0]; return p && p.photos ? p.photos.length : 0; })();
    var room = PHOTO_MAX - currentCount;
    if (room <= 0) {
      toast("사진은 최대 " + PHOTO_MAX + "장까지만 등록할 수 있어요.");
      el.value = "";
      return;
    }
    var tooBig = files.some(function (f) { return f.size > PHOTO_MAX_BYTES; });
    if (tooBig) {
      toast("사진 한 장의 용량이 너무 커요 (10MB 이하로 올려주세요).");
      el.value = "";
      return;
    }
    if (files.length > room) {
      toast("최대 " + PHOTO_MAX + "장까지만 담겨서 앞에서부터 " + room + "장만 추가했어요.");
      files = files.slice(0, room);
    }

    Promise.all(files.map(readFileAsDataUrl)).then(function (dataUrls) {
      if (isNew) {
        dataUrls.forEach(function (d) { pendingPhotos.push({ data: d }); });
        refreshPendingPhotosUI();
      } else {
        var p = state.products.filter(function (x) { return x.id === targetId; })[0];
        if (p) {
          var prevPhotos = p.photos ? p.photos.slice() : [];
          p.photos = (p.photos || []).concat(dataUrls);
          saveProduct(p).then(function (ok) {
            if (ok) { toast('"' + p.name + '"에 사진 저장됨'); } else { p.photos = prevPhotos; }
            renderModal();
            render();
          });
        }
      }
    }).catch(function () {
      toast("사진을 읽는 중 문제가 생겼어요. 다시 시도해주세요.");
    });
  });

  // 엔터로 비밀번호 제출
  document.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && e.target && e.target.id === "gate-pw") {
      handleGateAttempt(e.target.value || "");
    }
    if (e.key === "Enter" && e.target && e.target.id === "pw-input") {
      var v = (e.target.value || "");
      tryAdminLogin(v).then(function (ok) {
        if (ok) { state.modal = null; state.mode = "admin"; state.query = ""; render(); renderModal(); }
        else { var el = document.getElementById("pw-err"); if (el) el.classList.remove("hidden"); }
      });
    }
  });

  // 비고 인라인 수정 저장 (blur)
  document.addEventListener("blur", function (e) {
    if (e.target && e.target.getAttribute && e.target.getAttribute("data-note-id")) {
      var id = e.target.getAttribute("data-note-id");
      var val = (e.target.value || "").trim();
      var p = state.products.filter(function (x) { return x.id === id; })[0];
      if (p && p.note !== val) {
        var prevNote = p.note;
        p.note = val;
        saveProduct(p).then(function (ok) {
          if (ok) toast("비고 저장됨"); else { p.note = prevNote; e.target.value = prevNote; }
        });
      }
      return;
    }
    var fid = e.target && e.target.getAttribute && e.target.getAttribute("data-field-id");
    if (fid) {
      var field = e.target.getAttribute("data-field");
      var fp = state.products.filter(function (x) { return x.id === fid; })[0];
      if (!fp) return;
      if (field === "name") {
        var nv = (e.target.value || "").trim();
        if (!nv) { toast("제품명은 비워둘 수 없어요."); e.target.value = fp.name; return; }
        if (fp.name !== nv) {
          var prevName = fp.name;
          fp.name = nv;
          e.target.value = nv;
          saveProduct(fp).then(function (ok) {
            if (ok) toast("제품명 저장됨"); else { fp.name = prevName; e.target.value = prevName; }
          });
        }
      } else if (field === "vendor") {
        var vv = (e.target.value || "").trim() || "미기입";
        e.target.value = vv;
        if (fp.vendor !== vv) {
          var prevVendor = fp.vendor;
          fp.vendor = vv;
          saveProduct(fp).then(function (ok) {
            if (ok) toast("업체명 저장됨"); else { fp.vendor = prevVendor; e.target.value = prevVendor; }
          });
        }
      } else if (field === "weight") {
        var wv = parseFloat(e.target.value);
        if (isNaN(wv) || wv <= 0) { toast("알당중량은 숫자로 입력해주세요."); e.target.value = fp.weight; return; }
        e.target.value = wv;
        if (fp.weight !== wv) {
          var prevWeight = fp.weight;
          fp.weight = wv;
          saveProduct(fp).then(function (ok) {
            if (ok) toast("알당중량 저장됨"); else { fp.weight = prevWeight; e.target.value = prevWeight; }
          });
        }
      }
    }
  }, true);

  // 구분(만두/김말이) 선택은 change 시 바로 저장
  document.addEventListener("change", function (e) {
    var sel = e.target;
    if (!sel || !sel.matches || !sel.matches(".mcard-meta-select")) return;
    var sid = sel.getAttribute("data-field-id");
    var sp = state.products.filter(function (x) { return x.id === sid; })[0];
    if (sp && sp.type !== sel.value) {
      var prevType = sp.type;
      sp.type = sel.value;
      saveProduct(sp).then(function (ok) {
        if (ok) toast("구분 저장됨"); else { sp.type = prevType; sel.value = prevType; }
      });
    }
  });

  // ---- 시작 ----
  renderGate();

  // PWA 서비스워커 등록 (홈 화면에 추가 가능하게)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () { /* 조용히 무시 */ });
    });
  }
})();
</script>


<div id="modal-root"></div><div id="toast" class="toast hidden"></div></body></html>
